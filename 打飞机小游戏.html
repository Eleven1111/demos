<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>打飞机小游戏</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #05060f; overflow: hidden; }
  #wrap { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  canvas {
    background: #0b1026; border: 1px solid #24306b; border-radius: 8px;
    box-shadow: 0 0 40px rgba(60, 90, 255, .25);
    max-width: 100vw; max-height: 100vh; touch-action: none; cursor: crosshair;
  }
  #soundBtn {
    position: fixed; top: 10px; right: 10px; z-index: 10;
    font: 14px/1.2 "Microsoft YaHei", "PingFang SC", sans-serif;
    padding: 6px 12px; border-radius: 6px; border: 1px solid #3a4a8c;
    background: rgba(20, 28, 60, .85); color: #cfe0ff; cursor: pointer;
  }
  #soundBtn:hover { background: rgba(40, 55, 110, .9); }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="480" height="640"></canvas></div>
<button id="soundBtn">🔊 音效：开</button>

<script>
'use strict';
/* =====================================================
 * 打飞机小游戏 —— 经典纵版射击
 * 单文件 / 零依赖 / Canvas + Web Audio API
 * ===================================================== */

// ==================== 画布与常量 ====================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 480, H = 640;                 // 逻辑分辨率
const PLAYER_SPEED = 330;               // 玩家速度（像素/秒）
const BULLET_SPEED = 640;               // 子弹速度
const DROP_CHANCE = 0.12;               // 道具掉落概率
const FIRE_NORMAL = 0.20, FIRE_BOOST = 0.11; // 射击间隔（按住空格加速）

// ==================== 工具函数 ====================
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist2 = (x1, y1, x2, y2) => { const dx = x2 - x1, dy = y2 - y1; return dx * dx + dy * dy; };

// ==================== 音效模块（Web Audio API） ====================
const Sound = {
  ctx: null, enabled: true,
  // 浏览器要求用户操作后才能启动音频，这里在点击/按键时调用
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) { try { this.ctx = new AC(); } catch (e) {} }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  ok() { return this.enabled && this.ctx; },
  // 短音：频率/时长/波形/音量/滑音目标/延迟
  tone(freq, dur, type, vol, slideTo, delay = 0) {
    if (!this.ok()) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(this.ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  // 噪声：爆炸声
  noise(dur, vol, filterFreq = 1000) {
    if (!this.ok()) return;
    const t0 = this.ctx.currentTime;
    const len = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filterFreq;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f).connect(g).connect(this.ctx.destination);
    src.start(t0);
  },
  shoot()        { this.tone(760 + Math.random() * 120, 0.07, 'square', 0.035, 240); },
  enemyShoot()   { this.tone(300, 0.09, 'sawtooth', 0.03, 140); },
  hit()          { this.noise(0.05, 0.05, 3000); },
  explosion()    { this.noise(0.28, 0.16, 900); this.tone(160, 0.22, 'triangle', 0.09, 50); },
  bigExplosion() { this.noise(0.6, 0.25, 600); this.tone(110, 0.5, 'triangle', 0.14, 35); },
  pickup()       { this.tone(660, 0.08, 'sine', 0.09); this.tone(990, 0.12, 'sine', 0.09, null, 0.08); },
  shieldBreak()  { this.tone(500, 0.15, 'square', 0.08, 180); this.noise(0.15, 0.08, 2000); },
  playerDown()   { this.noise(0.5, 0.22, 700); this.tone(220, 0.4, 'sawtooth', 0.12, 40); },
  bossWarn()     { this.tone(180, 0.25, 'square', 0.1, 120); this.tone(180, 0.25, 'square', 0.1, 120, 0.3); },
};
const soundBtn = document.getElementById('soundBtn');
function toggleSound() {
  Sound.enabled = !Sound.enabled;
  Sound.ensure();
  soundBtn.textContent = Sound.enabled ? '🔊 音效：开' : '🔇 音效：关';
}
soundBtn.addEventListener('click', () => { toggleSound(); soundBtn.blur(); });

// ==================== 游戏状态 ====================
let state = 'menu';           // menu | playing | paused | gameover
let score = 0, best = 0, lives = 3, kills = 0, wave = 1;
let newRecord = false;
try { best = +localStorage.getItem('plane_best') || 0; } catch (e) {}
function saveBest() { try { localStorage.setItem('plane_best', best); } catch (e) {} }

// ==================== 实体容器 ====================
const playerBullets = [], enemyBullets = [], enemies = [], powerups = [], particles = [], texts = [];
let boss = null;              // 当前 BOSS 引用
let spawnLeft = 0, spawnTimer = 0;
let banner = { text: '', t: 0, max: 0, color: '#fff' };
let shakeT = 0, shakeDur = 0, shakeMag = 0;   // 屏幕震动

// ==================== 玩家 ====================
const player = { x: W / 2, y: H - 90, r: 14, power: 1, shield: false, alive: true,
                 fireTimer: 0, invuln: 0, flash: 0, tilt: 0 };

// ==================== 敌机配置（4 种） ====================
const ENEMY_TYPES = {
  normal: { hp: 1,  speed: 105, r: 15, score: 100,  color: '#e74c3c', fireInterval: 0   }, // 普通机
  fast:   { hp: 1,  speed: 225, r: 11, score: 150,  color: '#f39c12', fireInterval: 0   }, // 快速机
  tank:   { hp: 5,  speed: 55,  r: 23, score: 300,  color: '#9b59b6', fireInterval: 2.8 }, // 血厚机
  boss:   { hp: 60, speed: 0,   r: 42, score: 2000, color: '#c0392b', fireInterval: 1.25 }, // BOSS
};
// 道具配置
const POWERUP_INFO = {
  double: { label: '双', color: '#ffd54f', name: '双发子弹' },
  triple: { label: '三', color: '#ff8a65', name: '三发子弹' },
  shield: { label: '盾', color: '#4dd0e1', name: '护盾' },
  life:   { label: '命', color: '#f48fb1', name: '生命' },
};

// ==================== 输入模块（键盘/鼠标/触屏） ====================
const keys = {};
let dragging = false, dragDX = 0, dragDY = 0, mouseGX = W / 2, mouseGY = H - 90;

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  Sound.ensure();
  keys[k] = true;
  if (k === 'enter' || k === ' ') { if (state === 'menu' || state === 'gameover') startGame(); }
  if (k === 'p' || k === 'escape') {
    if (state === 'playing') state = 'paused';
    else if (state === 'paused') state = 'playing';
  }
  if (k === 'm') toggleSound();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// 坐标换算：CSS 缩放后的像素 → 游戏逻辑坐标
function toGame(cx, cy) {
  const r = canvas.getBoundingClientRect();
  return { x: (cx - r.left) * W / r.width, y: (cy - r.top) * H / r.height };
}
canvas.addEventListener('mousedown', e => {
  Sound.ensure();
  if (state === 'menu' || state === 'gameover') { startGame(); return; }
  if (state === 'paused') { state = 'playing'; return; }
  if (state !== 'playing') return;
  const p = toGame(e.clientX, e.clientY);
  dragging = true; dragDX = player.x - p.x; dragDY = player.y - p.y; // 记录抓取偏移，飞机不跳变
});
addEventListener('mousemove', e => { if (!dragging) return; const p = toGame(e.clientX, e.clientY); mouseGX = p.x; mouseGY = p.y; });
addEventListener('mouseup', () => dragging = false);
canvas.addEventListener('touchstart', e => {
  e.preventDefault(); Sound.ensure();
  if (state === 'menu' || state === 'gameover') { startGame(); return; }
  if (state === 'paused') { state = 'playing'; return; }
  if (state !== 'playing') return;
  const t = e.touches[0], p = toGame(t.clientX, t.clientY);
  dragging = true; dragDX = player.x - p.x; dragDY = player.y - p.y; mouseGX = p.x; mouseGY = p.y;
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!dragging) return;
  const t = e.touches[0], p = toGame(t.clientX, t.clientY);
  mouseGX = p.x; mouseGY = p.y;
}, { passive: false });
canvas.addEventListener('touchend', e => { e.preventDefault(); dragging = false; }, { passive: false });
canvas.addEventListener('contextmenu', e => e.preventDefault());
// 切出页面自动暂停
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing') state = 'paused'; });
addEventListener('blur', () => { if (state === 'playing') state = 'paused'; });

// ==================== 星空背景 ====================
const stars = [];
for (let i = 0; i < 90; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, layer: randInt(0, 2) });
const STAR_CFG = [{ sp: 30, s: 1, a: 0.4 }, { sp: 70, s: 1.6, a: 0.65 }, { sp: 130, s: 2.4, a: 0.95 }];
function updateStars(dt) {
  const speedK = state === 'playing' ? 1 : 0.4;
  for (const s of stars) {
    s.y += STAR_CFG[s.layer].sp * dt * speedK;
    if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
  }
}

// ==================== 特效：粒子 / 飘字 / 震屏 ====================
function explode(x, y, r) {
  const n = 10 + Math.floor(r * 0.8);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = rand(40, 220);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.3, 0.7), maxLife: 0.7, size: rand(2, 5),
      color: pick(['#ff9800', '#ffc107', '#ff5722', '#fff176', '#e0e0e0']) });
  }
}
function spark(x, y) {
  for (let i = 0; i < 5; i++) {
    const a = Math.random() * Math.PI * 2, sp = rand(30, 120);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.1, 0.25), maxLife: 0.25, size: rand(1, 3), color: pick(['#fff', '#fff59d']) });
  }
}
function ringParticles(x, y, color) {
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    particles.push({ x, y, vx: Math.cos(a) * 180, vy: Math.sin(a) * 180,
      life: 0.35, maxLife: 0.35, size: 3, color });
  }
}
function updateParticles(dt) {
  const damp = Math.exp(-3 * dt);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= damp; p.vy *= damp;
  }
}
function addText(x, y, text, color) { texts.push({ x, y, text, color, t: 0, life: 1.0 }); }
function updateTexts(dt) {
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i]; t.t += dt; t.y -= 30 * dt;
    if (t.t > t.life) texts.splice(i, 1);
  }
}
function addShake(mag, dur) {
  shakeMag = Math.max(shakeMag, mag);
  shakeDur = Math.max(shakeDur, dur);
  shakeT = Math.max(shakeT, dur);
}

// ==================== 波次管理 ====================
function showBanner(text, color, dur) { banner = { text, t: dur, max: dur, color }; }
function startWave(n) {
  wave = n;
  if (n % 5 === 0) {           // 每 5 波一个 BOSS
    spawnEnemy('boss');
    spawnLeft = Math.floor(n / 2);   // 护航小怪
    showBanner('⚠ 第 ' + n + ' 波 — BOSS 来袭 ⚠', '#ff5252', 3);
  } else {
    spawnLeft = 8 + n * 4;
    showBanner('第 ' + n + ' 波', '#ffffff', 2);
  }
  spawnTimer = 0.6;
}
// 按波次加权随机挑选敌机类型
function pickType() {
  const w = [['normal', Math.max(2, 6 - wave * 0.25)]];
  if (wave >= 2) w.push(['fast', 1.5 + wave * 0.25]);
  if (wave >= 3) w.push(['tank', 1 + wave * 0.3]);
  let sum = 0; for (const [, x] of w) sum += x;
  let r = Math.random() * sum;
  for (const [t, x] of w) { if ((r -= x) < 0) return t; }
  return 'normal';
}
const spawnInterval = () => Math.max(0.32, 0.95 - wave * 0.05);
function spawnEnemy(forceType) {
  const type = forceType || pickType();
  const cfg = ENEMY_TYPES[type];
  // 血量随波次缓慢增长
  const hpScale = type === 'boss' ? (45 + wave * 7)
    : cfg.hp + Math.floor((wave - 1) / 4) * (type === 'tank' ? 2 : 1);
  const e = {
    type, x: rand(50, W - 50), y: -40, t: 0,
    hp: hpScale, maxHp: hpScale,
    speed: cfg.speed * (1 + wave * 0.04) * rand(0.9, 1.1),
    r: cfg.r, score: cfg.score, flash: 0,
    fireTimer: rand(1, cfg.fireInterval || 2),
  };
  if (type === 'boss') { e.x = W / 2; e.y = -70; e.enterY = 120; boss = e; Sound.bossWarn(); }
  enemies.push(e);
}
function updateWaves(dt) {
  if (banner.t > 0) banner.t -= dt;
  if (spawnLeft > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) { spawnEnemy(); spawnLeft--; spawnTimer = spawnInterval(); }
  } else if (enemies.length === 0 && !boss) {
    startWave(wave + 1);   // 本波清完进入下一波
  }
}

// ==================== 射击 ====================
function playerFire() {
  const px = player.x, py = player.y - 18;
  let shots = [[0, 0]];
  if (player.power === 2) shots = [[-9, 0], [9, 0]];
  else if (player.power >= 3) shots = [[0, 0], [-11, 0.09], [11, -0.09]];
  for (const [off, ang] of shots) {
    playerBullets.push({ x: px + off, y: py, vx: Math.sin(ang) * BULLET_SPEED, vy: -Math.cos(ang) * BULLET_SPEED, r: 4, dmg: 1 });
  }
  particles.push({ x: px, y: py - 4, vx: 0, vy: -60, life: 0.08, maxLife: 0.08, size: 5, color: '#fff59d' }); // 枪口火光
  Sound.shoot();
}
function enemyFire(e) {
  if (e.type === 'boss' && e.y < e.enterY) return;   // BOSS 入场完毕才开火
  const base = Math.atan2(player.y - e.y, player.x - e.x);
  const n = e.type === 'boss' ? 3 : 1;               // BOSS 三连散射
  for (let k = 0; k < n; k++) {
    const a = base + (n > 1 ? (k - 1) * 0.28 : 0);
    enemyBullets.push({ x: e.x, y: e.y + e.r * 0.6, vx: Math.cos(a) * 230, vy: Math.sin(a) * 230, r: 5 });
  }
  Sound.enemyShoot();
}

// ==================== 道具 ====================
function rollKind() {
  const r = Math.random();
  if (r < 0.28) return 'double';
  if (r < 0.48) return 'triple';
  if (r < 0.78) return 'shield';
  return 'life';
}
function dropPowerup(x, y) {
  powerups.push({ x: clamp(x, 24, W - 24), y, r: 14, kind: rollKind(), t: 0, life: 8 });
}
function applyPowerup(p) {
  const info = POWERUP_INFO[p.kind];
  if (p.kind === 'double') {
    if (player.power >= 2) { score += 200; addText(player.x, player.y - 34, '火力已满 +200', '#fff'); }
    else { player.power = 2; addText(player.x, player.y - 34, info.name + '！', info.color); }
  } else if (p.kind === 'triple') {
    if (player.power >= 3) { score += 200; addText(player.x, player.y - 34, '火力已满 +200', '#fff'); }
    else { player.power = 3; addText(player.x, player.y - 34, info.name + '！', info.color); }
  } else if (p.kind === 'shield') {
    player.shield = true; addText(player.x, player.y - 34, info.name + '启动！', info.color);
  } else if (p.kind === 'life') {
    lives = Math.min(5, lives + 1); addText(player.x, player.y - 34, info.name + ' +1', info.color);
  }
  Sound.pickup();
}

// ==================== 伤害逻辑 ====================
function killEnemy(e, index) {
  enemies.splice(index, 1);
  score += e.score; kills++;
  addText(e.x, e.y, '+' + e.score, '#ffee58');
  explode(e.x, e.y, e.r);
  if (e.type === 'boss') {
    boss = null;
    addShake(14, 0.6);
    Sound.bigExplosion();
    dropPowerup(e.x - 24, e.y); dropPowerup(e.x + 24, e.y);  // BOSS 必掉双道具
    enemyBullets.length = 0;                                  // BOSS 死亡清空敌弹
  } else {
    addShake(e.type === 'tank' ? 6 : 3, 0.2);
    Sound.explosion();
    if (Math.random() < DROP_CHANCE) dropPowerup(e.x, e.y);
  }
}
function damagePlayer() {
  if (player.invuln > 0 || !player.alive) return;
  if (player.shield) {   // 护盾挡一次伤害
    player.shield = false; player.invuln = 1.2; player.flash = 0.15;
    addText(player.x, player.y - 34, '护盾碎裂！', '#4dd0e1');
    ringParticles(player.x, player.y, '#4dd0e1');
    addShake(7, 0.3); Sound.shieldBreak();
    return;
  }
  lives--;
  player.power = Math.max(1, player.power - 1);   // 掉一级火力
  player.invuln = 2.5; player.flash = 0.3;
  explode(player.x, player.y, 22);
  addShake(12, 0.5); Sound.playerDown();
  if (lives <= 0) {
    player.alive = false;
    explode(player.x, player.y, 30);
    gameOver();
  } else {
    player.x = W / 2; player.y = H - 90;          // 重生回底部中央
  }
}

// ==================== 更新逻辑 ====================
function updatePlayer(dt) {
  // 键盘移动
  let mx = 0, my = 0;
  if (keys['arrowleft'] || keys['a']) mx -= 1;
  if (keys['arrowright'] || keys['d']) mx += 1;
  if (keys['arrowup'] || keys['w']) my -= 1;
  if (keys['arrowdown'] || keys['s']) my += 1;
  if (mx || my) {
    const len = Math.hypot(mx, my);
    player.x += mx / len * PLAYER_SPEED * dt;
    player.y += my / len * PLAYER_SPEED * dt;
    player.tilt = mx / len * 0.25;                // 机身侧倾
  } else {
    player.tilt *= Math.pow(0.001, dt);
  }
  // 鼠标/触屏拖动：平滑跟随抓取点
  if (dragging) {
    const tx = clamp(mouseGX + dragDX, 20, W - 20);
    const ty = clamp(mouseGY + dragDY, H * 0.3, H - 24);
    const k = Math.min(1, dt * 25);
    player.x += (tx - player.x) * k;
    player.y += (ty - player.y) * k;
  }
  player.x = clamp(player.x, 18, W - 18);
  player.y = clamp(player.y, H * 0.3, H - 24);
  // 自动射击（按住空格加强火力）
  player.fireTimer -= dt;
  if (player.fireTimer <= 0) {
    playerFire();
    player.fireTimer = keys[' '] ? FIRE_BOOST : FIRE_NORMAL;
  }
}
function updateBullets(dt) {
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < -20 || b.x < -20 || b.x > W + 20) playerBullets.splice(i, 1);
  }
}
function updateEnemyBullets(dt) {
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > H + 20 || b.y < -20 || b.x < -20 || b.x > W + 20) enemyBullets.splice(i, 1);
  }
}
function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.t += dt;
    if (e.flash > 0) e.flash -= dt;
    if (e.type === 'boss') {
      if (e.y < e.enterY) e.y += 70 * dt;                              // 入场
      else { e.x = W / 2 + Math.sin(e.t * 0.9) * 150; e.y = e.enterY + Math.sin(e.t * 1.7) * 18; } // 左右巡航
    } else if (e.type === 'fast') {
      e.y += e.speed * dt;
      e.x += Math.sin(e.t * 5) * 50 * dt;                              // 蛇形机动
    } else {
      e.y += e.speed * dt;
      if (e.type === 'tank') e.x += Math.sin(e.t * 1.2) * 20 * dt;
    }
    // 敌机开火（血厚机与 BOSS）
    const cfg = ENEMY_TYPES[e.type];
    if (cfg.fireInterval > 0 && e.y > 10 && e.y < H * 0.75) {
      e.fireTimer -= dt;
      if (e.fireTimer <= 0) { enemyFire(e); e.fireTimer = cfg.fireInterval * rand(0.85, 1.15); }
    }
    if (e.y > H + 60) { enemies.splice(i, 1); if (e === boss) boss = null; }
  }
}
function updatePowerups(dt) {
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.t += dt; p.y += 70 * dt; p.x += Math.sin(p.t * 3) * 20 * dt; p.life -= dt;
    if (p.life <= 0 || p.y > H + 30) { powerups.splice(i, 1); continue; }
    const rr = p.r + player.r + 6;
    if (player.alive && dist2(p.x, p.y, player.x, player.y) < rr * rr) {
      applyPowerup(p); powerups.splice(i, 1);
    }
  }
}
function checkCollisions() {
  if (!player.alive) return;
  // 玩家子弹 vs 敌机
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j], rr = e.r + b.r;
      if (dist2(b.x, b.y, e.x, e.y) < rr * rr) {
        playerBullets.splice(i, 1);
        e.hp -= b.dmg; e.flash = 0.08;                 // 击中闪白
        spark(b.x, b.y); Sound.hit();
        if (e.hp <= 0) killEnemy(e, j);
        break;
      }
    }
  }
  if (player.invuln > 0) return;
  // 敌机撞击玩家
  for (let j = enemies.length - 1; j >= 0; j--) {
    const e = enemies[j], rr = e.r + player.r;
    if (dist2(player.x, player.y, e.x, e.y) < rr * rr) {
      killEnemy(e, j);
      damagePlayer();
      break;
    }
  }
  // 敌弹 vs 玩家
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i], rr = b.r + player.r;
    if (dist2(player.x, player.y, b.x, b.y) < rr * rr) {
      enemyBullets.splice(i, 1);
      spark(player.x, player.y);
      damagePlayer();
      break;
    }
  }
}
function update(dt) {
  updatePlayer(dt);
  updateBullets(dt);
  updateEnemies(dt);
  updateWaves(dt);
  updatePowerups(dt);
  updateEnemyBullets(dt);
  checkCollisions();
  if (player.invuln > 0) player.invuln -= dt;
  if (player.flash > 0) player.flash -= dt;
}

// ==================== 绘制 ====================
const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
bgGrad.addColorStop(0, '#0a0e2a'); bgGrad.addColorStop(1, '#131a3a');

function centerText(text, y, size, color, weight = 'bold') {
  ctx.font = weight + ' ' + size + 'px "Microsoft YaHei","PingFang SC",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = color;
  ctx.fillText(text, W / 2, y);
}
function drawStars() {
  for (const s of stars) {
    const c = STAR_CFG[s.layer];
    ctx.globalAlpha = c.a;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(s.x, s.y, c.s, c.s);
  }
  ctx.globalAlpha = 1;
}
function drawPlayer() {
  if (!player.alive) return;
  ctx.save();
  ctx.translate(player.x, player.y);
  if (player.invuln > 0 && Math.floor(player.invuln * 12) % 2 === 0) ctx.globalAlpha = 0.35; // 无敌闪烁
  ctx.rotate(player.tilt);
  // 尾焰
  const fl = 0.7 + Math.random() * 0.6;
  ctx.fillStyle = 'rgba(255,152,0,0.9)';
  ctx.beginPath(); ctx.moveTo(-4, 12); ctx.lineTo(0, 12 + 12 * fl); ctx.lineTo(4, 12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,235,59,0.9)';
  ctx.beginPath(); ctx.moveTo(-2, 12); ctx.lineTo(0, 12 + 6 * fl); ctx.lineTo(2, 12); ctx.closePath(); ctx.fill();
  // 机翼
  ctx.fillStyle = '#1e88e5';
  ctx.beginPath(); ctx.moveTo(-4, -2); ctx.lineTo(-21, 13); ctx.lineTo(-4, 10); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(4, -2); ctx.lineTo(21, 13); ctx.lineTo(4, 10); ctx.closePath(); ctx.fill();
  // 尾翼
  ctx.fillStyle = '#1565c0';
  ctx.beginPath(); ctx.moveTo(-3, 9); ctx.lineTo(-10, 19); ctx.lineTo(-2, 16); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(3, 9); ctx.lineTo(10, 19); ctx.lineTo(2, 16); ctx.closePath(); ctx.fill();
  // 机身
  ctx.fillStyle = '#42a5f5';
  ctx.beginPath(); ctx.moveTo(0, -21); ctx.lineTo(5, -4); ctx.lineTo(5, 12); ctx.lineTo(-5, 12); ctx.lineTo(-5, -4); ctx.closePath(); ctx.fill();
  // 座舱
  ctx.fillStyle = '#bbdefb';
  ctx.beginPath(); ctx.ellipse(0, -5, 2.6, 6, 0, 0, Math.PI * 2); ctx.fill();
  // 击中闪白
  if (player.flash > 0) {
    ctx.globalAlpha = Math.min(1, player.flash / 0.3) * 0.8;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  // 护盾光环
  if (player.shield) {
    const a = 0.5 + Math.sin(performance.now() / 150) * 0.2;
    ctx.strokeStyle = 'rgba(77,208,225,' + a + ')';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(player.x, player.y, 27, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(77,208,225,' + (a * 0.15) + ')';
    ctx.fill();
  }
}
function drawEnemies() {
  for (const e of enemies) {
    ctx.save();
    ctx.translate(e.x, e.y);
    const cfg = ENEMY_TYPES[e.type];
    ctx.fillStyle = cfg.color;
    if (e.type === 'normal') {          // 普通机：红色战斗机
      ctx.beginPath(); ctx.moveTo(0, e.r); ctx.lineTo(-e.r * 1.15, -e.r * 0.65); ctx.lineTo(-e.r * 0.4, -e.r * 0.25);
      ctx.lineTo(0, -e.r * 0.95); ctx.lineTo(e.r * 0.4, -e.r * 0.25); ctx.lineTo(e.r * 1.15, -e.r * 0.65); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff8a80';
      ctx.beginPath(); ctx.arc(0, -e.r * 0.1, e.r * 0.3, 0, Math.PI * 2); ctx.fill();
    } else if (e.type === 'fast') {     // 快速机：橙色标枪
      ctx.beginPath(); ctx.moveTo(0, e.r * 1.35); ctx.lineTo(-e.r * 0.85, -e.r); ctx.lineTo(0, -e.r * 0.35); ctx.lineTo(e.r * 0.85, -e.r); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffe0b2';
      ctx.beginPath(); ctx.arc(0, 0, e.r * 0.25, 0, Math.PI * 2); ctx.fill();
    } else if (e.type === 'tank') {     // 血厚机：紫色重甲
      ctx.beginPath();
      for (let k = 0; k < 6; k++) {
        const a = Math.PI / 6 + k * Math.PI / 3;
        const px = Math.cos(a) * e.r, py = Math.sin(a) * e.r;
        k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#7b1fa2';
      ctx.beginPath(); ctx.arc(0, 0, e.r * 0.55, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e1bee7';
      ctx.beginPath(); ctx.arc(0, 0, e.r * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#4a148c';        // 炮管
      ctx.fillRect(-e.r * 0.5, e.r * 0.5, 4, 10);
      ctx.fillRect(e.r * 0.5 - 4, e.r * 0.5, 4, 10);
      const w = e.r * 2;                // 小血条
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(-w / 2, -e.r - 10, w, 5);
      ctx.fillStyle = '#7cfc00'; ctx.fillRect(-w / 2, -e.r - 10, w * clamp(e.hp / e.maxHp, 0, 1), 5);
    } else if (e.type === 'boss') {     // BOSS：红色战舰
      ctx.fillStyle = '#8e2424';
      ctx.beginPath(); ctx.moveTo(0, e.r * 1.15); ctx.lineTo(-e.r * 0.55, e.r * 0.4); ctx.lineTo(-e.r * 1.25, -e.r * 0.35);
      ctx.lineTo(-e.r * 0.9, -e.r * 0.85); ctx.lineTo(e.r * 0.9, -e.r * 0.85); ctx.lineTo(e.r * 1.25, -e.r * 0.35); ctx.lineTo(e.r * 0.55, e.r * 0.4);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#b71c1c';
      ctx.beginPath(); ctx.arc(-e.r * 0.85, 0, e.r * 0.35, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(e.r * 0.85, 0, e.r * 0.35, 0, Math.PI * 2); ctx.fill();
      const pulse = 0.7 + Math.sin(e.t * 6) * 0.3;   // 脉冲核心
      ctx.fillStyle = 'rgba(255,80,80,' + pulse + ')';
      ctx.beginPath(); ctx.arc(0, 0, e.r * 0.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#4a0e0e';
      ctx.fillRect(-e.r * 0.6, e.r * 0.5, 8, 16);
      ctx.fillRect(e.r * 0.6 - 8, e.r * 0.5, 8, 16);
      ctx.fillRect(-4, e.r * 0.7, 8, 14);
    }
    // 击中闪白
    if (e.flash > 0) {
      ctx.globalAlpha = Math.min(1, e.flash / 0.08) * 0.85;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(0, 0, e.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
}
function drawBullets() {
  // 玩家子弹：黄色光条
  ctx.strokeStyle = '#ffee58'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (const b of playerBullets) {
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.012, b.y - b.vy * 0.012); ctx.stroke();
  }
  // 敌弹：红色光球
  for (const b of enemyBullets) {
    ctx.fillStyle = 'rgba(255,87,34,0.35)';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff5722';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffcdd2';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.4, 0, Math.PI * 2); ctx.fill();
  }
}
function drawPowerups() {
  for (const p of powerups) {
    // 即将消失时闪烁
    if (p.life < 2 && Math.floor(p.life * 8) % 2 === 0) continue;
    const info = POWERUP_INFO[p.kind];
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.fillStyle = info.color + '33';   // 光晕
    ctx.beginPath(); ctx.arc(0, 0, p.r + 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = info.color;
    ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#212121';
    ctx.font = 'bold 15px "Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(info.label, 0, 1);
    ctx.restore();
  }
  ctx.textBaseline = 'alphabetic';
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawTexts() {
  ctx.font = 'bold 14px "Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  for (const t of texts) {
    ctx.globalAlpha = Math.max(0, 1 - t.t / t.life);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}
function drawHUD() {
  if (state === 'menu') return;
  ctx.fillStyle = 'rgba(3,6,20,0.45)';
  ctx.fillRect(0, 0, W, 34);
  ctx.font = '16px "Microsoft YaHei",sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ff5577';                    // 生命
  ctx.fillText('♥'.repeat(Math.max(0, lives)), 12, 18);
  ctx.fillStyle = '#ffd54f';                    // 火力
  ctx.fillText('火力 ' + '★'.repeat(player.power), 120, 18);
  if (player.shield) {                          // 护盾
    ctx.fillStyle = '#4dd0e1';
    ctx.fillText('🛡 护盾', 210, 18);
  }
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';   // 分数
  ctx.fillText('分数 ' + score, W / 2, 18);
  ctx.textAlign = 'right'; ctx.fillStyle = '#80deea'; // 波次
  ctx.fillText('第 ' + wave + ' 波', W - 12, 18);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  // BOSS 血条
  if (boss) {
    const w = 260, x = (W - w) / 2, y = 44;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(x - 2, y - 2, w + 4, 12);
    ctx.fillStyle = '#5c1010'; ctx.fillRect(x, y, w, 8);
    ctx.fillStyle = '#ff3d3d'; ctx.fillRect(x, y, w * clamp(boss.hp / boss.maxHp, 0, 1), 8);
    ctx.font = '12px "Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffb3b3';
    ctx.fillText('BOSS', W / 2, y + 22);
    ctx.textAlign = 'left';
  }
}
function drawBanner() {
  if (banner.t <= 0) return;
  const a = banner.t > banner.max - 0.3 ? (banner.max - banner.t) / 0.3 : Math.min(1, banner.t / 0.5);
  ctx.globalAlpha = clamp(a, 0, 1);
  centerText(banner.text, H * 0.3, 32, banner.color);
  ctx.globalAlpha = 1;
}
// ==================== 界面（开始 / 暂停 / 结束） ====================
function drawMenu() {
  ctx.fillStyle = 'rgba(4,8,24,0.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.shadowColor = '#4fc3f7'; ctx.shadowBlur = 24;
  centerText('打飞机小游戏', H * 0.2, 52, '#e3f2fd');
  ctx.restore();
  centerText('—— 经典纵版射击 ——', H * 0.2 + 38, 18, '#90caf9');
  const lines = [
    '移动：方向键 / WASD / 鼠标拖动 / 触屏拖动',
    '射击：自动开火，按住空格可加强火力',
    '暂停：P 键　　音效开关：M 键 / 右上角按钮',
    '击落敌机获取道具：双发 / 三发 / 护盾 / 加命',
    '每 5 波出现一个 BOSS，祝武运昌隆！',
  ];
  lines.forEach((s, i) => centerText(s, H * 0.42 + i * 30, 16, '#cfd8dc'));
  if (Math.floor(performance.now() / 500) % 2 === 0) {
    centerText('按 Enter 或 点击屏幕 开始游戏', H * 0.78, 22, '#ffee58');
  }
  if (best > 0) centerText('最高分：' + best, H * 0.87, 16, '#80deea');
}
function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);
  centerText('已暂停', H * 0.42, 42, '#ffffff');
  centerText('按 P 继续游戏', H * 0.42 + 44, 20, '#ffee58');
}
function drawGameOver() {
  ctx.fillStyle = 'rgba(24,4,8,0.72)';
  ctx.fillRect(0, 0, W, H);
  centerText('游戏结束', H * 0.28, 48, '#ff5252');
  if (newRecord) centerText('🎉 新纪录！', H * 0.28 + 44, 22, '#ffee58');
  centerText('得分：' + score, H * 0.46, 26, '#ffffff');
  centerText('击落敌机：' + kills + ' 架', H * 0.46 + 36, 18, '#b0bec5');
  centerText('最高分：' + best, H * 0.46 + 64, 18, '#80deea');
  if (Math.floor(performance.now() / 500) % 2 === 0) {
    centerText('按 Enter 或 点击屏幕 重新开始', H * 0.72, 20, '#ffee58');
  }
}
function render() {
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  // 屏幕震动
  if (shakeT > 0) {
    const k = shakeDur > 0 ? shakeT / shakeDur : 0;
    ctx.translate((Math.random() * 2 - 1) * shakeMag * k, (Math.random() * 2 - 1) * shakeMag * k);
  }
  drawStars();
  drawPowerups();
  drawEnemies();
  drawBullets();
  drawPlayer();
  drawParticles();
  drawTexts();
  ctx.restore();
  drawHUD();
  drawBanner();
  if (state === 'menu') drawMenu();
  else if (state === 'paused') drawPause();
  else if (state === 'gameover') drawGameOver();
}

// ==================== 流程控制 ====================
function startGame() {
  Sound.ensure();
  state = 'playing';
  score = 0; lives = 3; kills = 0; newRecord = false;
  player.x = W / 2; player.y = H - 90;
  player.power = 1; player.shield = false; player.alive = true;
  player.fireTimer = 0; player.invuln = 2; player.flash = 0; player.tilt = 0;
  playerBullets.length = 0; enemyBullets.length = 0;
  enemies.length = 0; powerups.length = 0;
  particles.length = 0; texts.length = 0;
  boss = null; shakeT = 0; shakeDur = 0; shakeMag = 0;
  dragging = false;
  startWave(1);
}
function gameOver() {
  state = 'gameover';
  if (score > best) { best = score; newRecord = true; saveBest(); }
}

// ==================== 主循环 ====================
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  let dt = Math.min((now - last) / 1000, 0.05);   // 防止切标签页后大步长
  last = now;
  updateStars(dt);
  updateParticles(dt);
  updateTexts(dt);
  if (shakeT > 0) { shakeT -= dt; if (shakeT <= 0) { shakeT = 0; shakeDur = 0; shakeMag = 0; } }
  if (state === 'playing') update(dt);
  render();
}
requestAnimationFrame(loop);
</script>
</body>
</html>
